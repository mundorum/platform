[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# server/ must be importable for config.settings; settings.py then adds
# noid/authoring and vp/server itself.
pythonpath = .
python_files = tests.py test_*.py
# `cd server && pytest` runs every app's tests that use the shared server.
testpaths = . ../noid/authoring ../vp/server
